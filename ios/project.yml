name: ShiftLog
options:
  bundleIdPrefix: kz.shiftlog
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  ShiftLog:
    type: application
    platform: iOS
    sources: [ShiftLog]
    info:
      path: ShiftLog/Info.plist
      properties:
        CFBundleDisplayName: Смена
        ShiftLogAPIBaseURL: $(SHIFTLOG_API_URL)
        ShiftLogInitialDate: $(SHIFTLOG_INITIAL_DATE)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Подключение к локальному серверу дневника смен.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: kz.shiftlog.ShiftLog
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: false
  ShiftLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShiftLogTests]
    dependencies:
      - target: ShiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  ShiftLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShiftLogUITests]
    dependencies:
      - target: ShiftLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  ShiftLog:
    build:
      targets:
        ShiftLog: all
        ShiftLogTests: [test]
        ShiftLogUITests: [test]
    test:
      targets: [ShiftLogTests, ShiftLogUITests]
