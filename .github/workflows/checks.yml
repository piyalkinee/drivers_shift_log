name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Race tests, coverage and vet
        run: make test
      - name: Check Go formatting
        run: test -z "$(gofmt -l backend)"
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Unit and UI tests against isolated Go server
        run: make test-ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: build/TestResults/*.xcresult
